<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  /* Runs before first paint: if the guest is already verified, mark the
     document so the nav renders in its final place instantly instead of
     replaying its entrance animation on every page change. */
  try { if (sessionStorage.getItem("wedding_party")) document.documentElement.classList.add("authed"); } catch (e) {}
</script>
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<!-- Fonts (change here AND in _sass/_theme.scss to swap typefaces) -->
<!-- The stylesheet only reveals p.typekit.net once it parses, so warm that connection early. -->
<link rel="preconnect" href="https://p.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/fgo8odo.css">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Flickity -->
<link href="https://cdn.jsdelivr.net/npm/flickity@2.3.0/dist/flickity.min.css" rel="stylesheet">

<!-- Site styles -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<!-- jQuery + Flickity JS -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flickity@2.3.0/dist/flickity.pkgd.min.js"></script>
